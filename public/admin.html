<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08080d">
<title>Admin — Miss &amp; Mister</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.wrap{max-width:780px;padding:20px 14px 70px}
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px;margin:12px 0;
  box-shadow:0 18px 50px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05)}
.card h3{font-family:var(--font-display);font-size:1.15rem;margin:0 0 10px;color:var(--gold-hi);letter-spacing:.04em}
button{font-family:var(--font-body);padding:11px 15px;border:1px solid var(--line-soft);border-radius:12px;font-weight:800;margin:4px 6px 4px 0;cursor:pointer;color:var(--txt);background:rgba(255,255,255,.06);transition:transform .12s ease,filter .2s}
button:active{transform:scale(.96)}
.on{background:linear-gradient(180deg,#6fe39a,#2f9e57);color:#06130b;border-color:#bff0d2}
.off{background:rgba(255,255,255,.07)}
.danger{background:linear-gradient(180deg,#e88,#a82e2e);color:#fff;border-color:#ffb3b3}
.gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,#c9962e);color:#241a02;border-color:#ffe9a8;box-shadow:0 6px 22px rgba(233,185,73,.3)}
.hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero .bignum{font-family:var(--font-display);font-size:2.6rem;font-weight:800;line-height:1;
  background:linear-gradient(175deg,#fff6dd,var(--gold-hi) 45%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero small{color:var(--mut);letter-spacing:.2em;text-transform:uppercase;font-size:.68rem}
.bar-row{display:flex;align-items:center;gap:9px;margin:7px 0;font-size:.88rem}
.bar-row .who{min-width:0;flex:0 0 168px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:14px;background:rgba(255,255,255,.08);border-radius:999px;flex:1;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--violet),var(--gold));box-shadow:0 0 12px rgba(233,185,73,.35);transition:width .6s ease}
.bar-row b{min-width:34px;text-align:right}.bar-row small{color:var(--mut);min-width:44px;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
img.th{width:100%;height:130px;object-fit:cover;border-radius:12px;border:1px solid var(--line-soft)}
label.flabel{display:block;font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:8px 0 4px}
input[type=text],input[type=password],input[type=file]{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line-soft);background:rgba(0,0,0,.42);color:#fff;margin:3px 0;font-size:.9rem;box-sizing:border-box}
input:focus{outline:none;border-color:var(--gold)}
.sub-card{background:rgba(0,0,0,.3);border:1px solid var(--line-soft);border-radius:14px;padding:12px;margin:10px 0}
h1.page{font-family:var(--font-display);font-size:1.7rem;margin:14px 0 2px}
.page-sub{color:var(--mut);font-size:.88rem;margin:0 0 6px}
</style>
</head>
<body>
<div class="wrap">
<h1 class="page">🎛️ Consola Admin</h1>
<p class="page-sub">Miss &amp; Mister · Balul Bobocilor</p>
<div class="card" id="loginBox">
  <label class="flabel">Parola admin</label>
  <input type="password" id="pw" placeholder="••••••••">
  <div style="margin-top:10px"><button class="gold" onclick="login()">Autentificare</button></div>
  <div id="loginErr" style="color:#ff9a9a;margin-top:6px"></div>
</div>
<div id="dash" style="display:none">
  <div class="card hero">
    <div><div class="bignum" id="total">0</div><small>voturi totale</small></div>
    <div style="flex:1;min-width:180px">
      <div><span id="dotV" class="dot"></span><b id="vStatus">—</b></div>
      <div class="mut" style="font-size:.85rem;margin-top:4px" id="reveal">—</div>
      <div class="mut" style="font-size:.82rem;margin-top:4px">Voturi/min (ultimele 10): <span id="pm">—</span></div>
    </div>
  </div>
  <div class="card">
    <button id="btnVote" class="on" onclick="toggleVoting()">Deschide/Închide votarea</button>
    <button class="gold" onclick="revealBoth(1)">🏆 Dezvăluie câștigătorii</button>
    <button class="off" onclick="revealBoth(0)">Ascunde câștigătorii</button>
    <button class="off" onclick="location.href='/api/admin/export.csv'">Export CSV</button>
    <button class="danger" onclick="resetVotes()">Reset voturi</button>
  </div>
  <div class="card"><h3>🤵 Mister</h3><div id="boys"></div></div>
  <div class="card"><h3>👑 Miss</h3><div id="girls"></div></div>
  <div class="card"><h3>📽️ Proiector <a href="/projector" target="_blank" style="color:var(--gold);font-size:.8rem">deschide ↗</a></h3>
    <label class="flabel">Link vot (URL-ul din codul QR — IP-ul laptopului în WiFi-ul sălii)</label>
    <input type="text" id="voteUrl" placeholder="http://192.168.1.50:3000/">
    <div style="margin-top:8px">
      <button class="off" onclick="suggestUrl()">Detectează IP-ul meu</button>
      <button class="gold" onclick="saveProjector()">Salvează + arată QR pe proiector</button>
      <button class="off" onclick="hideQR()">Ascunde QR</button>
    </div>
    <div style="display:flex;gap:10px;align-items:end;margin-top:8px;flex-wrap:wrap">
      <div><label class="flabel">Countdown (secunde)</label><input type="text" id="cdSecs" value="5" style="width:90px"></div>
      <div class="mut" style="font-size:.82rem" id="qrState">—</div>
    </div>
  </div>
  <div class="card"><h3>🗳️ Voturi recente <button class="off" style="padding:6px 12px;font-size:.78rem" onclick="loadVotes()">Reîmprospătează</button></h3>
    <div class="mut" style="font-size:.82rem;margin-bottom:8px">Șterge un vot ca dispozitivul respectiv să poată vota din nou („uită cine a votat").</div>
    <div id="votes"></div></div>
  <div class="card"><h3>✏️ Editează cupluri</h3><div id="couples"></div></div>
  <div class="card"><button class="off" onclick="logout()">Ieși</button></div>
</div>
</div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var votingOpen=false;
async function login(){
  var r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});
  if(!r.ok){document.getElementById('loginErr').textContent='Parolă greșită.';return;}
  document.getElementById('loginBox').style.display='none';
  document.getElementById('dash').style.display='block';
  startSSE(); loadCouples();
}
async function api(u,m,b){
  var r=await fetch(u,{method:m||'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
  if(r.status===401){location.reload();throw 0;}
  return r.json();
}
function row(r){
  return '<div class="bar-row"><span class="who">'+esc(r.name)+' <span class="mut">nr.'+r.number+'</span></span><div class="bar"><i style="width:'+Math.min(100,r.pct)+'%"></i></div><b>'+r.votes+'</b><small>'+r.pct+'%</small></div>';
}
function render(s){
  votingOpen=s.voting_open;
  document.getElementById('total').textContent=s.total;
  document.getElementById('vStatus').textContent=s.voting_open?'VOTARE DESCHISĂ':'VOTARE ÎNCHISĂ';
  var dot=document.getElementById('dotV');
  dot.style.background=s.voting_open?'var(--green)':'var(--danger)';
  dot.style.color=s.voting_open?'var(--green)':'var(--danger)';
  document.getElementById('reveal').textContent='Miss: '+(s.miss_revealed?'dezvăluit':'ascuns')+' · Mister: '+(s.mister_revealed?'dezvăluit':'ascuns');
  document.getElementById('pm').textContent=(s.perMinute||[]).join(' ');
  document.getElementById('boys').innerHTML=s.boys.map(row).join('');
  document.getElementById('girls').innerHTML=s.girls.map(row).join('');
  document.getElementById('btnVote').textContent=s.voting_open?'Închide votarea':'Deschide votarea';
}
function startSSE(){
  api('/api/admin/stats').then(render).catch(function(){});
  loadVotes(); loadProjector();
  var es=new EventSource('/api/admin/events');
  es.addEventListener('stats',function(e){render(JSON.parse(e.data));throttledVotes();});
}
async function loadProjector(){
  var r=await fetch('/api/projector'); var d=await r.json();
  document.getElementById('voteUrl').value=d.vote_url||'';
  document.getElementById('cdSecs').value=d.countdown_secs||5;
  document.getElementById('qrState').textContent=d.qr_visible?('QR vizibil → '+d.vote_url):'QR ascuns';
}
async function suggestUrl(){
  var n=await api('/api/admin/net');
  if(n.guessUrl) document.getElementById('voteUrl').value=n.guessUrl;
  else alert('Nu am găsit un IP de rețea.');
}
async function saveProjector(){
  var r=await api('/api/admin/projector','POST',{qr_visible:1,vote_url:document.getElementById('voteUrl').value,countdown_secs:parseInt(document.getElementById('cdSecs').value,10)});
  if(r && r.error){alert(r.error);return;}
  loadProjector();
}
async function hideQR(){
  await api('/api/admin/projector','POST',{qr_visible:0,vote_url:document.getElementById('voteUrl').value,countdown_secs:parseInt(document.getElementById('cdSecs').value,10)});
  loadProjector();
}
var lastVotesLoad=0;
function throttledVotes(){var n=Date.now();if(n-lastVotesLoad>5000){lastVotesLoad=n;loadVotes();}}
async function loadVotes(){
  lastVotesLoad=Date.now();
  var vs=await api('/api/admin/votes').catch(function(){return[];});
  document.getElementById('votes').innerHTML=vs.length?vs.map(function(v){
    var t=new Date(v.created_at);var hh=('0'+t.getHours()).slice(-2),mm=('0'+t.getMinutes()).slice(-2);
    return '<div class="bar-row"><span class="who" style="flex:1">'+esc(v.boy_name)+' (nr.'+v.boy_number+') + '+esc(v.girl_name)+' (nr.'+v.girl_number+') <span class="mut">· '+esc(v.device_short)+'… · '+hh+':'+mm+'</span></span><button class="danger" style="padding:6px 12px;font-size:.78rem" onclick="forgetVote('+v.id+')">Uită</button></div>';
  }).join(''):'<div class="mut">Niciun vot încă.</div>';
}
async function forgetVote(id){
  if(!confirm('Uiți acest vot? Dispozitivul va putea vota din nou.'))return;
  await api('/api/admin/votes/'+id,'DELETE');
  var s=await api('/api/admin/stats');render(s);loadVotes();
}
async function toggleVoting(){render(await api('/api/admin/voting','POST',{open:!votingOpen}));var s=await api('/api/admin/stats');render(s);loadVotes();}
async function reveal(w,v){await api('/api/admin/reveal','POST',{which:w,value:v});var s=await api('/api/admin/stats');render(s);}
async function revealBoth(v){await api('/api/admin/reveal-both','POST',{value:v});var s=await api('/api/admin/stats');render(s);}
async function resetVotes(){
  var c=prompt('Sigur ștergi TOATE voturile? Scrie RESET pentru confirmare:');
  if(c!=='RESET')return;
  await api('/api/admin/reset','POST',{confirm:'RESET'});
  var s=await api('/api/admin/stats');render(s);loadVotes();
}
async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.reload();}
async function loadCouples(){
  var cs=await api('/api/admin/couples');
  document.getElementById('couples').innerHTML=cs.map(function(c){
    return '<div class="sub-card">Nr.'+c.number+' — '+esc(c.team)+
    '<div class="grid2"><div><img class="th" src="'+esc(c.boy_photo)+'"><label class="flabel">Băiat</label><input type="text" id="b'+c.id+'" value="'+esc(c.boy_name)+'"></div>'+
    '<div><img class="th" src="'+esc(c.girl_photo)+'"><label class="flabel">Fată</label><input type="text" id="g'+c.id+'" value="'+esc(c.girl_name)+'"></div></div>'+
    '<label class="flabel">Echipă</label><input type="text" id="t'+c.id+'" value="'+esc(c.team)+'">'+
    '<div style="margin-top:8px"><button class="gold" onclick="saveC('+c.id+')">Salvează</button></div> '+
    '<label class="flabel">Poză nouă băiat</label><input type="file" id="fb'+c.id+'" accept="image/*"> <button onclick="upPhoto('+c.id+',\'boy\')">Încarcă băiat</button>'+
    '<label class="flabel">Poză nouă fată</label><input type="file" id="fg'+c.id+'" accept="image/*"> <button onclick="upPhoto('+c.id+',\'girl\')">Încarcă fată</button></div>';
  }).join('');
}
async function saveC(id){
  await api('/api/admin/couples/'+id,'PUT',{boy_name:document.getElementById('b'+id).value,girl_name:document.getElementById('g'+id).value,team:document.getElementById('t'+id).value});
  alert('Salvat.');
}
async function upPhoto(id,side){
  var f=document.getElementById((side==='boy'?'fb':'fg')+id).files[0];
  if(!f){alert('Alege un fișier.');return;}
  var fd=new FormData();fd.append('photo',f);fd.append('side',side);
  var r=await fetch('/api/admin/couples/'+id+'/photo',{method:'POST',body:fd});
  if(!r.ok){alert('Eroare la încărcare.');return;}
  loadCouples();
}
</script>
</body>
</html>
