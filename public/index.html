<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#08080d">
<title>Miss &amp; Mister — Votează</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.legend{display:flex;justify-content:space-between;margin:16px 2px 0;font-size:.72rem;font-weight:800;letter-spacing:.18em}
.legend .l{color:var(--blue)}.legend .r{color:var(--gold)}
.hint{text-align:center;color:var(--mut);font-size:.84rem;margin:10px 6px 0;line-height:1.5}
.hint b.b{color:var(--blue)}.hint b.g{color:var(--gold)}
.team{margin:20px 0 6px;text-align:center}
.team .tname{
  display:inline-block;font-family:var(--font-display);font-weight:700;font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;
  padding:7px 22px;border-radius:999px;color:var(--gold-hi);
  background:rgba(233,185,73,.08);border:1px solid var(--line);
  box-shadow:0 4px 18px rgba(233,185,73,.12), inset 0 1px 0 rgba(255,255,255,.08);
}
.team .tnum{color:var(--mut);font-size:.74rem;letter-spacing:.28em;margin-top:5px;text-transform:uppercase}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{
  position:relative;border-radius:var(--r);overflow:hidden;cursor:pointer;
  background:var(--card-solid);border:1px solid var(--line-soft);
  -webkit-tap-highlight-color:transparent;
  transition:transform .15s ease, border-color .2s ease, box-shadow .25s ease;
}
.card:active{transform:scale(.975)}
.card img{width:100%;height:190px;object-fit:cover;display:block;background:#000}
.card .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,transparent 30%,transparent 52%,rgba(0,0,0,.82) 100%);pointer-events:none}
.card .n{
  position:absolute;left:0;right:0;bottom:0;padding:26px 10px 10px;
  font-weight:700;font-size:.92rem;text-align:center;text-shadow:0 2px 8px #000;
}
.badge{
  position:absolute;top:8px;font-size:.64rem;font-weight:800;letter-spacing:.14em;
  border-radius:999px;padding:4px 10px;background:rgba(0,0,0,.62);border:1px solid var(--line-soft);
  backdrop-filter:blur(6px);z-index:2;
}
.badge.b{left:8px;color:var(--blue)}.badge.g{right:8px;color:var(--gold)}
.card.boy.sel{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),0 0 26px rgba(90,169,230,.45)}
.card.girl.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 26px rgba(233,185,73,.45)}
.tick{
  position:absolute;top:8px;width:30px;height:30px;border-radius:50%;z-index:2;
  display:none;align-items:center;justify-content:center;font-weight:900;font-size:1rem;color:#08131f;
  background:linear-gradient(180deg,#aee0ff,var(--blue));box-shadow:0 4px 14px rgba(90,169,230,.6);
}
.card.boy .tick{right:8px}
.card.girl .tick{left:8px;background:linear-gradient(180deg,var(--gold-hi),var(--gold));box-shadow:0 4px 14px rgba(233,185,73,.6)}
.card.sel .tick{display:flex;animation:pop .25s ease}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.bar{position:fixed;bottom:0;left:0;right:0;z-index:50;padding:12px 12px calc(12px + env(safe-area-inset-bottom));
  background:rgba(10,10,15,.86);border-top:1px solid var(--line-soft);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar .in{max-width:660px;margin:0 auto}
#pick{text-align:center;font-size:.9rem;color:var(--mut);margin-bottom:9px}
#pick b.b{color:var(--blue)}#pick b.g{color:var(--gold)}
#voteBtn{width:100%;padding:16px;font-size:1.06rem}
#msg{text-align:center;padding:40px 10px;font-size:1.05rem;color:var(--mut);font-family:var(--font-display)}
</style>
</head>
<body>
<div class="wrap">
  <header class="gala">
    <div class="over">Balul Bobocilor</div>
    <h1>Miss &amp; Mister</h1>
    <div class="rule"><span>✦ ✦ ✦</span></div>
    <p class="sub">Alege un Mister și un Miss — seara decide.</p>
  </header>
  <div class="err" id="err"></div>
  <div id="msg" style="display:none"></div>
  <div id="list" style="display:none">
    <div class="legend"><span class="l">🤵 Mister</span><span class="r">Miss 👑</span></div>
    <p class="hint">Apasă pe <b class="b">stânga</b> pentru Mister și pe <b class="g">dreapta</b> pentru Miss — pot fi din echipe diferite.</p>
    <div id="teams"></div>
  </div>
</div>
<div class="bar" id="bar" style="display:none"><div class="in">
  <div id="pick">—</div>
  <button id="voteBtn" class="btn btn-gold" disabled>Votează ✦</button>
</div></div>
<script>
// device token triple-store: cookie (server, httpOnly) + localStorage + IndexedDB
(function(){
  var t = null;
  try{ t = localStorage.getItem('mm_device'); }catch(e){}
  if(!t){ t = (crypto.randomUUID?crypto.randomUUID():'dev-'+Date.now()+'-'+Math.random()); try{localStorage.setItem('mm_device',t);}catch(e){} }
  try{
    var rq = indexedDB.open('mm',1);
    rq.onupgradeneeded = function(){ rq.result.createObjectStore('k'); };
    rq.onsuccess = function(){ try{ var tx=rq.result.transaction('k','readwrite'); tx.objectStore('k').put(t,'device'); }catch(e){} };
  }catch(e){}
  window.__mmDevice = t;
})();
function showErr(m){var e=document.getElementById('err');e.style.display='block';e.textContent=m;}
var state=null, boyPick=null, girlPick=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function personCard(c, side){
  var d=document.createElement('div');
  d.className='card '+side; d.dataset.id=c.id;
  var img = side==='boy'?c.boy_photo:c.girl_photo;
  var name = side==='boy'?c.boy_name:c.girl_name;
  d.innerHTML='<span class="badge '+(side==='boy'?'b':'g')+'">'+(side==='boy'?'🤵 MISTER':'MISS 👑')+'</span>'+
    (img?'<img loading="lazy" src="'+esc(img)+'" alt="">':'<div style="height:190px"></div>')+
    '<div class="shade"></div><div class="tick">✓</div><div class="n">'+esc(name)+'</div>';
  d.onclick=function(){ if(side==='boy'){boyPick=c.id;}else{girlPick=c.id;} paint(); };
  return d;
}
function paint(){
  document.querySelectorAll('#teams .card.boy').forEach(function(el){el.classList.toggle('sel',+el.dataset.id===boyPick);});
  document.querySelectorAll('#teams .card.girl').forEach(function(el){el.classList.toggle('sel',+el.dataset.id===girlPick);});
  document.getElementById('voteBtn').disabled=!(boyPick&&girlPick);
  var bn=state?state.couples.find(function(c){return c.id===boyPick;}):null;
  var gn=state?state.couples.find(function(c){return c.id===girlPick;}):null;
  document.getElementById('pick').innerHTML='🤵 <b class="b">'+esc(bn?bn.boy_name:'—')+'</b> &nbsp;+&nbsp; 👑 <b class="g">'+esc(gn?gn.girl_name:'—')+'</b>';
}
async function load(){
  // Server is source of truth: if admin "forgot" this device, let it vote again.
  try{
    var me=await fetch('/api/me',{headers:{'X-Device-Token':window.__mmDevice||''}});
    var mj=await me.json();
    if(mj && mj.voted){ try{localStorage.setItem('mm_voted','1');}catch(e){} location.replace('/thanks'); return; }
    try{localStorage.removeItem('mm_voted');}catch(e){}
  }catch(e){}
  var r=await fetch('/api/state',{headers:{'X-Device-Token':window.__mmDevice||''}});
  state=await r.json();
  if(!state.voting_open){
    document.getElementById('msg').style.display='block';
    document.getElementById('msg').textContent='Votarea e închisă — vă mulțumim pentru seara magică. ✦';
    return;
  }
  document.getElementById('list').style.display='block';
  document.getElementById('bar').style.display='block';
  var box=document.getElementById('teams');
  state.couples.forEach(function(c){
    var t=document.createElement('div'); t.className='team';
    t.innerHTML='<span class="tname">'+esc(c.team)+'</span><div class="tnum">perechea nr. '+c.number+'</div>';
    box.appendChild(t);
    var duo=document.createElement('div'); duo.className='duo';
    duo.appendChild(personCard(c,'boy'));
    duo.appendChild(personCard(c,'girl'));
    box.appendChild(duo);
  });
  paint();
}
document.getElementById('voteBtn').onclick=async function(){
  var b=this; b.disabled=true; b.textContent='Se trimite…';
  try{
    var r=await fetch('/api/vote',{method:'POST',headers:{'Content-Type':'application/json','X-Device-Token':window.__mmDevice||''},body:JSON.stringify({boy_couple_id:boyPick,girl_couple_id:girlPick,device_token:window.__mmDevice})});
    var j=await r.json().catch(function(){return{};});
    if(r.status===409){try{localStorage.setItem('mm_voted','1');}catch(e){} location.replace('/thanks');return;}
    if(!r.ok){showErr(j.error||'Eroare la vot.');b.disabled=false;b.textContent='Votează ✦';return;}
    try{localStorage.setItem('mm_voted','1');}catch(e){}
    location.replace('/thanks');
  }catch(e){showErr('Eroare de rețea.');b.disabled=false;b.textContent='Votează ✦';}
};
load();
</script>
</body>
</html>
