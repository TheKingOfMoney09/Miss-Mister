<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Miss &amp; Mister — Votează</title>
<style>
:root{--bg:#101014;--card:#1c1c22;--gold:#e8b64c;--blue:#5aa9e6;--txt:#f5f2ea;--mut:#a9a5b8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:12px 12px 130px}
h1{font-size:1.4rem;text-align:center;margin:14px 0 2px}
.sub{text-align:center;color:var(--mut);margin:0 0 4px;font-size:.95rem}
.legend{display:flex;justify-content:space-between;max-width:640px;margin:10px 2px 0;font-size:.8rem;font-weight:800;letter-spacing:.04em}
.legend .l{color:var(--blue)}.legend .r{color:var(--gold)}
.team{margin:14px 0 4px;text-align:center}
.team .tname{display:inline-block;background:#26262f;border:1px solid #3a3a46;border-radius:999px;padding:5px 16px;font-weight:800;font-size:.95rem}
.team .tnum{color:var(--mut);font-size:.78rem;margin-top:2px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:3px solid transparent;border-radius:14px;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
.card img{width:100%;height:170px;object-fit:cover;display:block;background:#000}
.card .n{padding:8px 8px 10px;font-weight:700;font-size:.92rem;text-align:center}
.card.boy.sel{border-color:var(--blue);box-shadow:0 0 14px #5aa9e677}
.card.girl.sel{border-color:var(--gold);box-shadow:0 0 14px #e8b64c77}
.badge{position:absolute;top:6px;font-size:.68rem;font-weight:800;border-radius:8px;padding:2px 8px;background:#000000aa}
.badge.b{left:6px;color:var(--blue)}.badge.g{right:6px;color:var(--gold)}
.tick{position:absolute;bottom:52px;right:6px;background:var(--gold);color:#000;font-weight:900;border-radius:50%;width:28px;height:28px;display:none;align-items:center;justify-content:center}
.card.girl.sel .tick{display:flex;background:var(--gold)}
.card.boy.sel .tick{display:flex;background:var(--blue);color:#fff}
.bar{position:fixed;bottom:0;left:0;right:0;background:#16161cf2;border-top:1px solid #333;padding:10px}
.bar .in{max-width:640px;margin:0 auto}
#pick{text-align:center;font-size:.88rem;color:var(--mut);margin-bottom:8px}
#pick b.b{color:var(--blue)}#pick b.g{color:var(--gold)}
#voteBtn{width:100%;padding:15px;border:0;border-radius:12px;font-size:1.05rem;font-weight:800;background:var(--gold);color:#201500}
#voteBtn:disabled{filter:grayscale(1);opacity:.45}
#msg{text-align:center;padding:30px 10px;font-size:1.1rem}
.err{background:#5b1a1a;border-radius:10px;padding:10px;margin:10px 0;text-align:center;display:none}
.hint{text-align:center;color:var(--mut);font-size:.82rem;margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>👑 Miss &amp; Mister</h1>
  <p class="sub">Balul Bobocilor — alege un Mister și un Miss</p>
  <div class="err" id="err"></div>
  <div id="msg" style="display:none"></div>
  <div id="list" style="display:none">
    <div class="legend"><span class="l">🤵 MISTER — băiatul</span><span class="r">fata — MISS 👑</span></div>
    <p class="hint">Apasă pe <b style="color:var(--blue)">stânga</b> pentru Mister și pe <b style="color:var(--gold)">dreapta</b> pentru Miss — pot fi din echipe diferite.</p>
    <div id="teams"></div>
  </div>
</div>
<div class="bar" id="bar" style="display:none"><div class="in">
  <div id="pick">—</div>
  <button id="voteBtn" disabled>Votează</button>
</div></div>
<script>
// device token triple-store: cookie (server, httpOnly) + localStorage + IndexedDB
(function(){
  var t = null;
  try{ t = localStorage.getItem('mm_device'); }catch(e){}
  if(!t){ t = (crypto.randomUUID?crypto.randomUUID():'dev-'+Date.now()+'-'+Math.random()); try{localStorage.setItem('mm_device',t);}catch(e){} }
  try{
    var rq = indexedDB.open('mm',1);
    rq.onupgradeneeded = function(){ rq.result.createObjectStore('k'); };
    rq.onsuccess = function(){ try{ var tx=rq.result.transaction('k','readwrite'); tx.objectStore('k').put(t,'device'); }catch(e){} };
  }catch(e){}
  window.__mmDevice = t;
})();
function showErr(m){var e=document.getElementById('err');e.style.display='block';e.textContent=m;}
var state=null, boyPick=null, girlPick=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function personCard(c, side){
  var d=document.createElement('div');
  d.className='card '+side; d.dataset.id=c.id;
  var img = side==='boy'?c.boy_photo:c.girl_photo;
  var name = side==='boy'?c.boy_name:c.girl_name;
  d.innerHTML='<span class="badge '+(side==='boy'?'b':'g')+'">'+(side==='boy'?'🤵':'👑')+'</span>'+
    (img?'<img loading="lazy" src="'+esc(img)+'" alt="">':'<div style="height:170px"></div>')+
    '<div class="tick">✓</div><div class="n">'+esc(name)+'</div>';
  d.onclick=function(){ if(side==='boy'){boyPick=c.id;}else{girlPick=c.id;} paint(); };
  return d;
}
function paint(){
  document.querySelectorAll('#teams .card.boy').forEach(function(el){el.classList.toggle('sel',+el.dataset.id===boyPick);});
  document.querySelectorAll('#teams .card.girl').forEach(function(el){el.classList.toggle('sel',+el.dataset.id===girlPick);});
  document.getElementById('voteBtn').disabled=!(boyPick&&girlPick);
  var bn=state?state.couples.find(function(c){return c.id===boyPick;}):null;
  var gn=state?state.couples.find(function(c){return c.id===girlPick;}):null;
  document.getElementById('pick').innerHTML='🤵 <b class="b">'+esc(bn?bn.boy_name:'—')+'</b> + 👑 <b class="g">'+esc(gn?gn.girl_name:'—')+'</b>';
}
async function load(){
  // Server is source of truth: if admin "forgot" this device, let it vote again.
  try{
    var me=await fetch('/api/me',{headers:{'X-Device-Token':window.__mmDevice||''}});
    var mj=await me.json();
    if(mj && mj.voted){ try{localStorage.setItem('mm_voted','1');}catch(e){} location.replace('/thanks'); return; }
    try{localStorage.removeItem('mm_voted');}catch(e){}
  }catch(e){}
  var r=await fetch('/api/state',{headers:{'X-Device-Token':window.__mmDevice||''}});
  state=await r.json();
  if(!state.voting_open){
    document.getElementById('msg').style.display='block';
    document.getElementById('msg').textContent='🕸️ Votarea e închisă. Mulțumim!';
    return;
  }
  document.getElementById('list').style.display='block';
  document.getElementById('bar').style.display='block';
  var box=document.getElementById('teams');
  state.couples.forEach(function(c){
    var t=document.createElement('div'); t.className='team';
    t.innerHTML='<span class="tname">'+esc(c.team)+'</span><div class="tnum">Nr. '+c.number+'</div>';
    box.appendChild(t);
    var duo=document.createElement('div'); duo.className='duo';
    duo.appendChild(personCard(c,'boy'));
    duo.appendChild(personCard(c,'girl'));
    box.appendChild(duo);
  });
  paint();
}
document.getElementById('voteBtn').onclick=async function(){
  var b=this; b.disabled=true;
  try{
    var r=await fetch('/api/vote',{method:'POST',headers:{'Content-Type':'application/json','X-Device-Token':window.__mmDevice||''},body:JSON.stringify({boy_couple_id:boyPick,girl_couple_id:girlPick,device_token:window.__mmDevice})});
    var j=await r.json().catch(function(){return{};});
    if(r.status===409){try{localStorage.setItem('mm_voted','1');}catch(e){} location.replace('/thanks');return;}
    if(!r.ok){showErr(j.error||'Eroare la vot.');b.disabled=false;return;}
    try{localStorage.setItem('mm_voted','1');}catch(e){}
    location.replace('/thanks');
  }catch(e){showErr('Eroare de rețea.');b.disabled=false;}
};
load();
</script>
</body>
</html>
